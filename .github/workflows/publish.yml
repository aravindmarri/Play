name: Publish Play and games
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Silent Stairs
        uses: actions/checkout@v4
        with:
          repository: aravindmarri/Silent-Stairs
          ref: main
          path: .games/Silent-Stairs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .games/Silent-Stairs/package-lock.json
      - name: Build Silent Stairs
        working-directory: .games/Silent-Stairs
        run: |
          npm ci
          npm run build -- --base=/Silent-Stairs/
      - name: Assemble gallery and game
        run: |
          mkdir -p _site/Silent-Stairs
          cp index.html style.css app.js align.js geometry.js ghost.js three.core.js three.module.js THREE-LICENSE.txt CNAME _site/
          cp -R .games/Silent-Stairs/dist/. _site/Silent-Stairs/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          page.write_text(page.read_text().replace('https://aravindmarri.github.io/Silent-Stairs/', '/Silent-Stairs/'))
          assert Path('_site/Silent-Stairs/index.html').is_file()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
